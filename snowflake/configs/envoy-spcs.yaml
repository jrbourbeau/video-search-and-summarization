# Static Envoy configuration for Snowpark Container Services deployment.
# Replaces the original dynamic XDS-based config that required the SDR service
# (which mounts /var/run/docker.sock and is incompatible with SPCS).
# Routes all traffic directly to the streamprocessing-ms on localhost:30001.

node:
  cluster: services
  id: ucs-svc-proxy

static_resources:
  listeners:
    - name: svc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                common_http_protocol_options:
                  idle_timeout: 3600s
                stream_idle_timeout: 300s
                request_timeout: 300s
                upgrade_configs:
                  - upgrade_type: websocket
                stream_error_on_invalid_http_message: false
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: streamprocessing
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: streamprocessing_cluster
                            timeout: 300s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: streamprocessing_cluster
      connect_timeout: 0.25s
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http_protocol_options: {}
      load_assignment:
        cluster_name: streamprocessing_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 30001
