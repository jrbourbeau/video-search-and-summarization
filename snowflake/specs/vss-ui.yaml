# Snowpark Container Services spec for the VSS UI (Next.js frontend).
#
# This service provides the web UI for interacting with the VSS Agent.
# It connects to the VSS Agent via WebSocket and HTTP.
#
# The NEXT_PUBLIC_WEBSOCKET_CHAT_COMPLETION_URL and
# NEXT_PUBLIC_HTTP_CHAT_COMPLETION_URL values are set at deploy time
# by deploy.sh after the vss-agent public endpoint URL is known.

spec:
  containers:
    - name: vss-ui
      image: /vss_db/vss_schema/vss_images/vss-agent-ui:3.1.0
      env:
        RUN_APP_NAME: nv-metropolis-bp-vss-ui
        # --- App branding ---
        NEXT_PUBLIC_APP_TITLE: VSS BLUEPRINT
        NEXT_PUBLIC_APP_SUBTITLE: Vision (Base)
        # --- Chat tab ---
        NEXT_PUBLIC_ENABLE_CHAT_TAB: "true"
        NEXT_PUBLIC_WORKFLOW: VSS Agent
        NEXT_PUBLIC_WEBSOCKET_CHAT_COMPLETION_URL: wss://AGENT_EXTERNAL_URL_PLACEHOLDER/websocket
        NEXT_PUBLIC_HTTP_CHAT_COMPLETION_URL: https://AGENT_EXTERNAL_URL_PLACEHOLDER/chat/stream
        NEXT_PUBLIC_WEB_SOCKET_DEFAULT_ON: "true"
        NEXT_PUBLIC_RIGHT_MENU_OPEN: "false"
        NEXT_PUBLIC_ENABLE_INTERMEDIATE_STEPS: "true"
        NEXT_PUBLIC_SHOW_THEME_TOGGLE_BUTTON: "false"
        NEXT_PUBLIC_DARK_THEME_DEFAULT: "true"
        NEXT_PUBLIC_SIDE_CHATBAR_COLLAPSED: "true"
        NEXT_PUBLIC_CHAT_HISTORY_DEFAULT_ON: "true"
        NEXT_PUBLIC_AGENT_API_URL_BASE: https://AGENT_EXTERNAL_URL_PLACEHOLDER/api/v1
        NEXT_PUBLIC_CHAT_INPUT_MIC_ENABLED: "false"
        NEXT_PUBLIC_CHAT_MESSAGE_EDIT_ENABLED: "false"
        NEXT_PUBLIC_CHAT_MESSAGE_SPEAKER_ENABLED: "false"
        NEXT_PUBLIC_CHAT_MESSAGE_COPY_ENABLED: "false"
        NEXT_PUBLIC_INTERACTION_MODAL_CANCEL_ENABLED: "false"
        NEXT_PUBLIC_CHAT_UPLOAD_FILE_ENABLE: "true"
        NEXT_PUBLIC_CHAT_UPLOAD_FILE_HIDDEN_MESSAGE_TEMPLATE: "Let's show the videos just uploaded {filenames}?"
        NEXT_PUBLIC_CHAT_UPLOAD_FILE_METADATA_ENABLED: "false"
        NEXT_PUBLIC_CHAT_API_CUSTOM_AGENT_PARAMS_JSON: '{"params":[{"name":"llm_reasoning","label":"LLM Reasoning","type":"boolean","default-value":false,"changeable":true,"tooltip-info":""},{"name":"vlm_reasoning","label":"VLM Reasoning","type":"boolean","default-value":false,"changeable":true,"tooltip-info":""}]}'
        # --- Alerts tab (disabled in base profile) ---
        NEXT_PUBLIC_ENABLE_ALERTS_TAB: "false"
        NEXT_PUBLIC_VST_API_URL: https://VST_EXTERNAL_URL_PLACEHOLDER/vst/api
        NEXT_PUBLIC_MDX_WEB_API_URL: ""
        NEXT_PUBLIC_ALERTS_TAB_MAX_RESULT_SIZE: "100"
        NEXT_PUBLIC_ALERTS_TAB_DEFAULT_TIME_WINDOW_IN_MINUTES: "10"
        NEXT_PUBLIC_ALERTS_TAB_DEFAULT_AUTO_REFRESH_IN_MILLISECONDS: "1000"
        NEXT_PUBLIC_ALERTS_TAB_VERIFIED_FLAG_DEFAULT: "false"
        NEXT_PUBLIC_ALERTS_TAB_ALERT_REPORT_PROMPT_TEMPLATE: "Generate a report for incident {incidentId} with sensor id {sensorId}."
        NEXT_PUBLIC_ALERTS_TAB_MAX_SEARCH_TIME_LIMIT: "0"
        NEXT_PUBLIC_ALERTS_TAB_MEDIA_WITH_OBJECTS_BBOX: "true"
        # --- Dashboard tab (disabled in base profile) ---
        NEXT_PUBLIC_ENABLE_DASHBOARD_TAB: "false"
        NEXT_PUBLIC_DASHBOARD_TAB_KIBANA_BASE_URL: ""
        # --- Map tab (disabled) ---
        NEXT_PUBLIC_ENABLE_MAP_TAB: "false"
        NEXT_PUBLIC_MAP_URL: ""
        # --- Video Management tab ---
        NEXT_PUBLIC_ENABLE_VIDEO_MANAGEMENT_TAB: "true"
        NEXT_PUBLIC_VIDEO_MANAGEMENT_TAB_ADD_RTSP_ENABLE: "false"
        NEXT_PUBLIC_VIDEO_MANAGEMENT_VIDEO_UPLOAD_ENABLE: "true"
        # --- Search tab (disabled in base profile) ---
        NEXT_PUBLIC_ENABLE_SEARCH_TAB: "false"
        NEXT_PUBLIC_SEARCH_TAB_MEDIA_WITH_OBJECTS_BBOX: "true"
        NEXT_PUBLIC_SEARCH_TAB_CHAT_SIDEBAR_ENABLE: "false"
      readinessProbe:
        port: 3000
        path: /
        initialDelaySeconds: 15
        periodSeconds: 10
      resources:
        requests:
          memory: "1Gi"
          cpu: "1"
        limits:
          memory: "2Gi"
          cpu: "2"

  endpoints:
    - name: ui
      port: 3000
      public: true
